[platformio]
default_envs = stm32-bluepill-f103c8-oled-128x32-stlink

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit ADXL345@^1.3.4
  adafruit/Adafruit Unified Sensor@^1.1.15
  olikraus/U8g2@^2.35.30

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1

[env:stm32-bluepill-f103c8-oled-128x32]
platform = ststm32
board = bluepill_f103c8
upload_protocol = serial
upload_speed = 115200
build_flags =
  -D DISPLAY_72X40=0
  -D I2C_SDA_PIN=PB7
  -D I2C_SCL_PIN=PB6
  -D LED_ACTIVE_LOW=1

[env:stm32-bluepill-f103c8-oled-128x32-stlink]
extends = env:stm32-bluepill-f103c8-oled-128x32
upload_protocol = stlink
